<div class="fields">
  <mat-form-field class="w-full">
    <mat-label>Order time</mat-label>
    <input matInput [ngxMatTimepicker]="orderTimePicker" [format]="24" [formControl]="timeOfOrderControl()">
    <button mat-icon-button matIconSuffix type="button" (click)="orderTimePicker.open()" aria-label="Pick order time">
      <mat-icon>schedule</mat-icon>
    </button>
    <mat-hint>When you'll call the restaurant</mat-hint>
  </mat-form-field>
  <ngx-mat-timepicker #orderTimePicker></ngx-mat-timepicker>

  @if (timeOfDeliveryControl) {
    <mat-form-field class="w-full">
      <mat-label>Expected delivery</mat-label>
      <input matInput [ngxMatTimepicker]="deliveryTimePicker" [format]="24" [formControl]="timeOfDeliveryControl">
      <button mat-icon-button matIconSuffix type="button" (click)="deliveryTimePicker.open()" aria-label="Pick delivery time">
        <mat-icon>schedule</mat-icon>
      </button>
      <mat-hint>Leave empty if unknown</mat-hint>
    </mat-form-field>
    <ngx-mat-timepicker #deliveryTimePicker></ngx-mat-timepicker>
  }
</div>
