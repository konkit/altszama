<div class="who">
  <span class="avatar" aria-hidden="true">{{ initial() }}</span>
  <span class="name">{{ title() }}</span>
  @if (isOrderEntryOwner()) {
    <span class="you">(you)</span>
  }
</div>

<div class="status">
  @if (shouldShowPaymentStatus()) {
    <app-payment-status-chip [isPaid]="isConfirmedAsPaid()"></app-payment-status-chip>

    @if (shouldShowConfirmAsPaidButton()) {
      <button mat-button (click)="confirmAsPaid(orderEntry().id)">
        <mat-icon>check</mat-icon>
        {{ isOrderOwner() ? 'Confirm payment' : "I've paid" }}
      </button>
    }
    @if (shouldShowRevertToUnpaid()) {
      <button mat-icon-button (click)="revertToUnpaid(orderEntry().id)" matTooltip="Mark as unpaid" aria-label="Mark as unpaid">
        <mat-icon>undo</mat-icon>
      </button>
    }
  }

  <span class="total">{{ orderEntry().finalPrice | price }}</span>
</div>
