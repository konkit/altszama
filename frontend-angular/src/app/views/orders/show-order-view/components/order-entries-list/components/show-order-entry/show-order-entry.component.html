<div class="lines">
  <div class="line">
    <span class="name">{{ dishEntry.dishName }}</span>
    <span class="price">{{ dishEntry.price | price }}</span>
  </div>

  @for (sideDish of dishEntry.sideDishes; track sideDish) {
    <div class="line side-dish">
      <span class="name">+ {{ sideDish.name }}</span>
      <span class="price">{{ sideDish.price | price }}</span>
    </div>
  }

  @if (dishEntry.comments.length > 0) {
    <div class="comment">“{{ dishEntry.comments }}”</div>
  }
</div>

@if (canEditOrderEntry()) {
  <div class="actions">
    <button mat-icon-button (click)="editDishEntry()" matTooltip="Edit dish" aria-label="Edit dish">
      <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button class="danger" (click)="deleteDishEntry()" matTooltip="Remove dish" aria-label="Remove dish">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
}
