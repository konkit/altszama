<div class="flex flex-wrap gap-2">
  <button mat-button (click)="goToEditOrder()">
    <mat-icon>edit</mat-icon>
    Edit order
  </button>

  @if (canShowPlaceOrderButton()) {
    <button mat-flat-button
            (click)="placeOrder()"
            [disabled]="isPlaceOrderButtonDisabled()"
            [disabledInteractive]="true"
            [matTooltip]="isPlaceOrderButtonDisabled() ? 'You cannot place an empty order. Choose a dish first.' : ''">
      <mat-icon>send</mat-icon>
      Place order
    </button>
  }

  @if (canShowMarkAsDeliveredButton()) {
    <button mat-flat-button (click)="setAsDelivered()">
      <mat-icon>done_all</mat-icon>
      Mark as delivered
    </button>
  }
</div>
