<div class="callout tone-warning" role="status">
  <mat-icon>lock</mat-icon>
  <div class="grow">
    <div class="callout-title">The order is locked</div>
    <div class="callout-text">
      Nobody can change their dishes while you call the restaurant. If you're not ordering yet, unlock it.
    </div>
    <div class="actions">
      <button mat-button (click)="unlockOrder()">
        <mat-icon>lock_open</mat-icon>
        Unlock
      </button>
      <button mat-flat-button (click)="placeOrder()">
        <mat-icon>call</mat-icon>
        Continue ordering
      </button>
    </div>
  </div>
</div>
