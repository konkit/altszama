@if (editOrderInitialData$ | async; as data) {
  <app-view-wrapper>
    <div>
      <button mat-button [routerLink]="['/orders', orderId, 'show']">
        <mat-icon>arrow_back</mat-icon>
        Back to order
      </button>
    </div>

    <header class="page-header">
      <h1>Edit order</h1>
      <div class="meta">
        <app-chip [tone]="getOrderStateTone(data.order.orderState)">
          {{ getOrderStateString(data.order.orderState) }}
        </app-chip>
        <span>{{ data.order.restaurantName }} · {{ data.order.orderDate }}</span>
      </div>
    </header>

    <form class="sections" (submit)="submitForm($event)">
      <mat-card appearance="outlined" class="timing">
        <mat-card-header>
          <mat-card-title>Timing</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <app-order-time-form [timeOfOrderControl]="orderForm.controls.timeOfOrder"
                               [timeOfDeliveryControl]="orderForm.controls.timeOfDelivery">
          </app-order-time-form>
        </mat-card-content>
      </mat-card>

      <mat-card appearance="outlined" class="delivery">
        <mat-card-header>
          <mat-card-title>Discounts & delivery fees</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <app-delivery-data-form [deliveryDataForm]="orderForm.controls.deliveryData"></app-delivery-data-form>
        </mat-card-content>
      </mat-card>

      <mat-card appearance="outlined" class="payment">
        <mat-card-header>
          <mat-card-title>Payment options</mat-card-title>
          <mat-card-subtitle>How people can pay you back</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <app-payment-data-form [paymentDataForm]="orderForm.controls.paymentData"></app-payment-data-form>
        </mat-card-content>
      </mat-card>

      <div class="form-actions">
        <button mat-button type="button" (click)="cancelEdit()">Cancel</button>
        <button mat-flat-button type="submit" [disabled]="isSaving">
          <mat-icon>check</mat-icon>
          Save changes
        </button>
      </div>
    </form>

    <mat-card appearance="outlined" class="status-card">
      <mat-card-header>
        <mat-card-title>Order status</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <app-order-state-buttons [orderId]="orderId" [orderState]="data.order.orderState"></app-order-state-buttons>
      </mat-card-content>
    </mat-card>
  </app-view-wrapper>
}
