<app-view-wrapper>
  <div>
    <button mat-button [routerLink]="['/restaurants']">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>
  </div>

  <header class="page-header">
    <h1>New restaurant</h1>
  </header>

  <form class="sections" (submit)="submit($event)" novalidate>
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>Details</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <app-restaurant-fields [form]="restaurantFormGroup"></app-restaurant-fields>
      </mat-card-content>
    </mat-card>

    <div class="form-actions">
      <button mat-button type="button" (click)="cancel()">Cancel</button>
      <button mat-flat-button type="submit" [disabled]="isSaving">
        <mat-icon>add</mat-icon>
        Create restaurant
      </button>
    </div>
  </form>
</app-view-wrapper>
