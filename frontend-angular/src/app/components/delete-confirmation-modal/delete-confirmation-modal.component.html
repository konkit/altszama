<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  {{ content }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close cdkFocusInitial>Cancel</button>
  <button mat-flat-button class="danger" (click)="onConfirmClick()">{{ confirmLabel }}</button>
</mat-dialog-actions>
